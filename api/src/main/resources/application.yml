spring:
  application:
    name: habits-api
  # URL, usuário e senha do banco vêm das variáveis SPRING_DATASOURCE_* (docker-compose.yml)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      # As tabelas de sessão são criadas pelo Flyway (V2__spring_session.sql)
      initialize-schema: never

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        # Persistente por 7 dias desde a entrada: o login sobrevive a fechar o navegador ou o app da
        # tela inicial (spec 010, RF-014). "Sair" invalida a sessão e devolve o cookie com Max-Age=0.
        max-age: 7d
        http-only: true
        same-site: lax
        secure: ${HABITS_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

habits:
  # Chaves das notificações (spec 011), geradas por scripts/gerar-vapid.sh e lidas do .env.
  # Vazias: as notificações aparecem como indisponíveis e o resto do app funciona.
  vapid:
    public-key: ${HABITS_VAPID_PUBLIC_KEY:}
    private-key: ${HABITS_VAPID_PRIVATE_KEY:}
    # Contato do responsável exigido pelos serviços de push (mailto: ou https:)
    subject: ${HABITS_VAPID_SUBJECT:mailto:contato@example.com}
  notifications:
    scheduler:
      # Tarefa que envia lembretes a cada minuto; desligada nos testes (chamados direto)
      enabled: ${HABITS_NOTIFICATIONS_SCHEDULER:true}
