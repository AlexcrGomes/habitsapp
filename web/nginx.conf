server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Atenção: um add_header dentro de um location faz o Nginx ignorar os do server. Por isso os
    # locations com Cache-Control próprio repetem os três cabeçalhos de segurança.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Mesma origem para o React e a API: cookies SameSite e CSRF sem CORS
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (gerados pelo Vite): nunca mudam, podem ficar em cache para sempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }

    # Versão publicada e service worker (spec 011): sempre conferidos com o servidor
    location = /version.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # Manifesto do app instalável (spec 010): tipo certo independente do mime.types da imagem
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # SPA: rotas desconhecidas caem no index.html. O index.html é sempre revalidado (no-cache):
    # abrir o app depois de uma publicação já traz a versão nova (spec 011, plan P13).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }
}
