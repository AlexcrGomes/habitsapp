<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Logomarca do Habits: letra H formada por blocos azuis, com o último bloco sendo encaixado</title>
  <!-- Ordem de "construção": base esquerda (mais escuro) → topo direito (mais claro) -->
  <rect x="5"    y="47"   width="15" height="15" rx="3.5" fill="#1E3A8A"/>
  <rect x="5"    y="29.5" width="15" height="15" rx="3.5" fill="#1E40AF"/>
  <rect x="5"    y="12"   width="15" height="15" rx="3.5" fill="#1D4ED8"/>
  <rect x="22.5" y="29.5" width="15" height="15" rx="3.5" fill="#2563EB"/>
  <rect x="40"   y="47"   width="15" height="15" rx="3.5" fill="#3B82F6"/>
  <rect x="40"   y="29.5" width="15" height="15" rx="3.5" fill="#60A5FA"/>
  <!-- Encaixe vazio onde o último bloco vai entrar -->
  <rect x="40"   y="12"   width="15" height="15" rx="3.5" fill="#DBEAFE"/>
  <!-- Último bloco, ainda descendo para o lugar -->
  <rect x="44"   y="3"    width="15" height="15" rx="3.5" fill="#93C5FD"
        transform="rotate(-12 51.5 10.5)"/>
</svg>
