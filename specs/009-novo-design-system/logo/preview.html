<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Habits — prévia</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #F8FAFC; color: #0B1B3F;
         font-family: Inter, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  section { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; margin-bottom: 32px; }
  figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
  figcaption { font-size: 12px; color: #475569; }
  .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 24px;
          box-shadow: 0 1px 2px rgb(16 24 40 / .06); }
  .navy { background: #0B1B3F; }
</style>
</head>
<body>
  <h1>Conceito da logo — spec 009</h1>
  <section>
    <figure class="card"><img src="logo-icone.svg" width="256" height="256" alt="Ícone em 256 px"><figcaption>Ícone · 256 px</figcaption></figure>
    <figure class="card"><img src="logo-icone.svg" width="64" height="64" alt="Ícone em 64 px"><figcaption>Ícone · 64 px</figcaption></figure>
    <figure class="card"><img src="logo-favicon.svg" width="32" height="32" alt="Favicon em 32 px"><figcaption>Favicon · 32 px</figcaption></figure>
    <figure class="card"><img src="logo-favicon.svg" width="16" height="16" alt="Favicon em 16 px"><figcaption>Favicon · 16 px</figcaption></figure>
  </section>
  <section>
    <figure class="card"><img src="logo-completa.svg" width="424" height="128" alt="Logo completa grande"><figcaption>Completa · 128 px de altura</figcaption></figure>
    <figure class="card"><img src="logo-completa.svg" width="141" height="42" alt="Logo completa no tamanho do menu"><figcaption>Completa · tamanho do menu lateral</figcaption></figure>
  </section>
</body>
</html>
