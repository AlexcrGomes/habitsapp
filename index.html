<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">

    <title>Habits</title>
</head>
<body>

    <header>
        <img src="assests/logo.svg" alt="Logomarca do aplicativo habits">
        <button type="button" id="register-day">
            <img src="assests/plus.svg" alt="ícone sinal de mais roxo">
            <div>
                Registrar o meu dia
            </div>
        </button>
    </header>

    <form id="form-habits">
        <div class="habits-column">
            <ul class="habits"></ul>
            <div class="habits-actions"></div>
        </div>

        <div class="days">
        </div>
    </form>

    <dialog id="habit-dialog" aria-labelledby="habit-dialog-title">
        <form id="habit-form">
            <h2 id="habit-dialog-title">Novo hábito</h2>

            <label for="habit-name">Nome</label>
            <input type="text" id="habit-name" maxlength="30" autocomplete="off" aria-describedby="habit-name-count">
            <small id="habit-name-count" class="dialog-hint">0/30</small>

            <label for="habit-emoji">Emoji (opcional)</label>
            <input type="text" id="habit-emoji" autocomplete="off" placeholder="Ex.: 🧘">

            <p id="habit-error" class="dialog-error" role="alert"></p>
            <button type="button" id="habit-restore" hidden>Restaurar o arquivado</button>

            <div class="dialog-actions">
                <button type="button" id="habit-archive" hidden>Arquivar</button>
                <button type="button" id="habit-cancel">Cancelar</button>
                <button type="submit" class="primary">Salvar</button>
            </div>
        </form>
    </dialog>

    <dialog id="archived-dialog" aria-labelledby="archived-dialog-title">
        <h2 id="archived-dialog-title">Hábitos arquivados</h2>
        <p id="archived-limit" class="dialog-hint" hidden>
            Limite de 10 hábitos ativos atingido. Arquive um hábito para restaurar outro.
        </p>
        <ul id="archived-list"></ul>
        <div class="dialog-actions">
            <button type="button" id="archived-close">Fechar</button>
        </div>
    </dialog>

    <script src="script.js"></script>

</body>
</html>
