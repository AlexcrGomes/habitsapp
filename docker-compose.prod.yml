# Produção (spec 008): usado junto com o docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# O Caddy é o único serviço exposto à internet (80/443) e cuida do HTTPS.
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HABITS_DOMAIN: ${HABITS_DOMAIN:?defina HABITS_DOMAIN no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados guardados entre deploys (evita o limite de emissão do Let's Encrypt)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    # Só o Caddy fala com o web, pela rede interna
    ports: !reset []

  api:
    # Sem a porta 127.0.0.1:8081 do desenvolvimento
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
