# Produção (spec 008): usado junto com o docker-compose.yml, no servidor compartilhado.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# O HTTPS e as portas 80/443 ficam com o proxy do repositório servidor-apps (Caddy), que
# encaminha habits.<domínio> para o web pela rede externa "proxy". Nenhum serviço do Habits
# publica porta no servidor, e db/api ficam só na rede interna do projeto.
services:
  web:
    ports: !reset []
    networks:
      default:
      proxy:
        # Nome que o Caddyfile do servidor-apps usa: reverse_proxy habits-web:80
        aliases: [habits-web]

  api:
    # Sem a porta 127.0.0.1:8081 do desenvolvimento
    ports: !reset []

networks:
  proxy:
    # Criada pelo scripts/server-setup.sh do servidor-apps
    external: true
